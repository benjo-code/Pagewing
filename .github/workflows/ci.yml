name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# Stale runs of the same ref are cancelled so the shared runners are not blocked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Avalonia.BuildServices would send anonymous usage data while compiling (Docs/DECISIONS.md, entry
# "Avalonia-Build-Telemetrie abschalten"); the app itself never connects anywhere.
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: build-${{ matrix.name }}
    # Trust model of the public repository (Docs/DECISIONS.md, entry "CI auf öffentlichem Repo ..."): every pull request
    # run, from a fork or not, goes to a GitHub-hosted runner; the owner's runners only get push runs on dev and main.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && format('["{0}"]', matrix.hosted) || format('["self-hosted","{0}"]', matrix.label)) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, label: dotnet-linux, hosted: ubuntu-24.04, rid: linux-x64, binary: pagewing, app: Pagewing }
          - { name: windows, label: dotnet-windows, hosted: windows-2025, rid: win-x64, binary: pagewing.exe, app: Pagewing.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without git on PATH (Windows runner) actions/checkout extracts a zip from the REST API. Its file times can lie
      # before the build of a file-based script (dotnet run <file>.cs) cached in %TEMP% by an earlier job, and the
      # incremental build then keeps the stale copy. Every checked-out file gets the current time instead.
      # A .git directory (only where git is installed) is left alone: git marks its pack files read-only, and the
      # refresh does not need them. Other files that cannot be touched are skipped; startup.cs itself must change.
      - name: Refresh the file times of the checkout (Windows)
        if: runner.os == 'Windows'
        run: |
          $before = (Get-Item bench/startup/startup.cs).LastWriteTimeUtc
          $now = [DateTime]::UtcNow
          $skipped = 0
          Get-ChildItem -Recurse -File -Force |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
            ForEach-Object {
              try { $_.LastWriteTimeUtc = $now } catch { $skipped++ }
            }
          $after = (Get-Item bench/startup/startup.cs).LastWriteTimeUtc
          if ($after -le $before) { throw "bench/startup/startup.cs konnte nicht aktualisiert werden (vorher $before, nachher $after)" }
          if ($skipped -gt 0) { Write-Host "$skipped Datei(en) nicht anfassbar (schreibgeschuetzt oder gesperrt), uebersprungen" }
          Write-Host ('bench/startup/startup.cs: {0:yyyy-MM-dd HH:mm:ss} UTC aus dem Checkout, gesetzt auf {1:yyyy-MM-dd HH:mm:ss} UTC' -f $before, $now)

      - name: Set DOTNET_INSTALL_DIR (no root on the runner)
        if: runner.os == 'Linux'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Set DOTNET_INSTALL_DIR (no root on the runner)
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_ENV -Value "DOTNET_INSTALL_DIR=$env:USERPROFILE\.dotnet"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The Native AOT linker needs vswhere.exe on PATH; it takes effect from the next step on.
      - name: Put vswhere on PATH
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      # Only on the GitHub-hosted image (pull requests): the image has most of this, but it is not guaranteed. The
      # self-hosted runner is set up by hand and the check below fails when something is missing there.
      - name: Install the Native AOT prerequisites (Linux, hosted runner)
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libfontconfig1

      - name: Check the Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v clang >/dev/null || { echo 'clang not found: install the clang package' >&2; exit 1; }
          clang --version
          test -f /usr/include/zlib.h || { echo 'zlib.h not found: install zlib1g-dev' >&2; exit 1; }
          # The startup check runs on the owner's runner only (push); the hosted runner does not need Xvfb.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            command -v xvfb-run >/dev/null || { echo 'xvfb-run not found (startup check): install the xvfb package' >&2; exit 1; }
          fi
          ldconfig -p | grep -q libfontconfig.so.1 || { echo 'libfontconfig.so.1 not found (Skia in the headless UI tests and the app): install the libfontconfig1 package' >&2; exit 1; }

      # Packaging (Milestone 8): the Linux packages are built here and must run on glibc 2.35 (Ubuntu 22.04).
      - name: Check the packaging prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          cat /etc/os-release
          ldd --version | head -1
          command -v dpkg-deb >/dev/null || echo '::warning::dpkg-deb not found (needed by release.yml, not here): install the dpkg package'
          command -v mksquashfs >/dev/null || echo '::warning::mksquashfs not found (needed by release.yml, not here): install squashfs-tools'
          command -v objdump >/dev/null || echo '::warning::objdump not found (the glibc check below needs it; release.yml fails without it): install binutils'
          command -v docker >/dev/null && docker --version || echo 'docker not found (information only)'

      - name: Check the Native AOT prerequisites (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command vswhere -ErrorAction SilentlyContinue)) { throw 'vswhere not found: install Visual Studio Build Tools' }
          $p = vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $p) { throw 'Visual Studio C++ build tools not found' }

      - name: Restore
        run: dotnet restore Pagewing.slnx

      - name: Check the test PDFs
        run: dotnet run tools/make-testpdfs.cs -- check

      - name: Build
        run: dotnet build Pagewing.slnx -c Release --no-restore

      # One test project at a time: by default `dotnet test` starts the three test projects together, and on the
      # two cores of a hosted runner the PDFium-heavy Core tests then starve the UI timing of the App tests (every
      # failure seen there fell into the first minute of the shared run; Docs/DECISIONS.md, entry "UI-Tests auf
      # gehosteten Linux-Runnern"). Costs about 45 s.
      - name: Test
        run: dotnet test Pagewing.slnx -c Release --no-build --max-parallel-test-modules 1

      # Renderings and diff images of failed render regression tests (see tests/Pagewing.Render.Tests).
      - name: Upload the render diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-diff-${{ matrix.name }}
          path: tests/Pagewing.Render.Tests/**/render-diff/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Format
        run: dotnet format Pagewing.slnx --verify-no-changes --no-restore

      - name: Publish the CLI (Native AOT)
        run: dotnet publish src/Pagewing.Cli -c Release -r ${{ matrix.rid }} -o out/cli

      - name: Smoke test of the CLI binary
        run: dotnet run tools/smoke-cli.cs -- out/cli/${{ matrix.binary }}

      - name: Publish the app (Native AOT)
        run: dotnet publish src/Pagewing.App -c Release -r ${{ matrix.rid }} -o out/app

      - name: Self-test of the packaging tool
        run: dotnet run tools/package.cs -- selftest

      - name: Self-test of the licence tool
        run: dotnet run tools/licenses.cs -- selftest

      # The test server of the manual update check (packaging/README.md, "Update prüfen"): routes, path traversal,
      # signing; it listens on 127.0.0.1 only and stops at the end.
      - name: Self-test of the update test server
        run: dotnet run tools/update-testserver.cs -- selftest

      # Fails when a package, a native file or the notices file no longer matches third-party/licenses.json.
      - name: Check the licence inventory
        run: dotnet run tools/licenses.cs -- check --publish-dir out/app --publish-dir out/cli

      # Information only: this runner builds with a newer glibc than 2.35 (Ubuntu 26.04, glibc 2.43, so the app needs
      # GLIBC_2.38). The release files are built in ubuntu:22.04 (packaging/linux/container-build.sh), where the same
      # check is blocking; Docs/DECISIONS.md, entry "Mindest-glibc 2.35 und Bauweise der Linux-Pakete".
      - name: Check the binaries against glibc 2.35 (Linux)
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          files=$(find out/app out/cli -maxdepth 1 -type f \( -name Pagewing -o -name pagewing -o -name '*.so' -o -name '*.so.*' \) | sort)
          # Which symbols need more than glibc 2.35 (for the decision entry); never fails the step.
          for f in $files; do objdump -T "$f" | grep -E '\(GLIBC_2\.(3[6-9]|[4-9][0-9])\)' | sed "s|^|$f: |" || true; done
          # shellcheck disable=SC2086
          dotnet run tools/package.cs -- check-binary $files --max-glibc 2.35

      # The startup check and its self-test run on the owner's runners after the merge (push to dev and main), not on
      # pull requests: the budgets are measured on the real runners; hosted images are not comparable.
      - name: Self-test of the startup check
        if: github.event_name != 'pull_request'
        run: dotnet run bench/startup/startup.cs -- selftest

      # Median of 10 runs per case against the budgets, fails above budget + 25 % (bench/startup/README.md).
      # All four cases run, so that every CSV exists; the step fails afterwards if one of them failed.
      - name: Startup check
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: |
          status=0
          check() { xvfb-run -a dotnet run bench/startup/startup.cs -- --exe "out/app/${{ matrix.app }}" "$@" || status=1; }
          check --pdf testdata/pdfs/text-basic.pdf --case cold --out out/startup/cold.csv
          check --pdf testdata/pdfs/text-basic.pdf --case warm --out out/startup/warm.csv --phases
          check --pdf testdata/pdfs/thousand-pages.pdf --case thousand --out out/startup/thousand.csv
          check --pdf testdata/pdfs/text-basic.pdf --second-pdf testdata/pdfs/hello_world.pdf --case second --out out/startup/second.csv
          exit $status

      - name: Startup check
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: |
          $failed = $false
          $cases = @(
            @('--pdf', 'testdata/pdfs/text-basic.pdf', '--case', 'cold', '--out', 'out/startup/cold.csv'),
            @('--pdf', 'testdata/pdfs/text-basic.pdf', '--case', 'warm', '--out', 'out/startup/warm.csv', '--phases'),
            @('--pdf', 'testdata/pdfs/thousand-pages.pdf', '--case', 'thousand', '--out', 'out/startup/thousand.csv'),
            @('--pdf', 'testdata/pdfs/text-basic.pdf', '--second-pdf', 'testdata/pdfs/hello_world.pdf', '--case', 'second', '--out', 'out/startup/second.csv')
          )
          foreach ($case in $cases) {
            dotnet run bench/startup/startup.cs -- --exe "out/app/${{ matrix.app }}" @case
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Upload the startup measurements
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-${{ matrix.name }}
          path: out/startup/*.csv
          if-no-files-found: warn
          retention-days: 3
